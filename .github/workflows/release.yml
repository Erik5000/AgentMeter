name: Release AgentMeter

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match CHANGELOG, e.g. 1.5.0). Leave empty to use the first non-Unreleased heading."
        required: false
        type: string

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version from changelog
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(awk '
              /^## \[/ && $0 !~ /\[Unreleased\]/ {
                sub(/^## \[/, "")
                sub(/\].*/, "")
                print
                exit
              }
            ' CHANGELOG.md)
          fi

          if [ -z "$VERSION" ]; then
            echo "Could not determine a release version from the workflow input or CHANGELOG.md"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CONTENT=$(awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)

          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Update version in project
        run: |
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = ${{ steps.version.outputs.version }}/g" ClaudeMeter.xcodeproj/project.pbxproj

          BUILD_NUMBER=$(echo "${{ steps.version.outputs.version }}" | sed 's/[^0-9]*\([0-9]*\).*/\1/')
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER/g" ClaudeMeter.xcodeproj/project.pbxproj

          echo "Updated version to ${{ steps.version.outputs.version }} (build $BUILD_NUMBER)"

      - name: Install Apple certificate
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing certificate configured; building an unsigned AgentMeter zip."
            exit 0
          fi

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          rm -f $RUNNER_TEMP/certificate.p12
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            xcodebuild clean build \
              -project ClaudeMeter.xcodeproj \
              -scheme ClaudeMeter \
              -configuration Release \
              -derivedDataPath ./build \
              -arch x86_64 -arch arm64 \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Developer ID Application" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime"
          else
            xcodebuild clean build \
              -project ClaudeMeter.xcodeproj \
              -scheme ClaudeMeter \
              -configuration Release \
              -derivedDataPath ./build \
              -arch x86_64 -arch arm64 \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Verify code signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          APP_PATH="build/Build/Products/Release/AgentMeter.app"
          echo "Verifying code signature..."
          codesign -vvv --deep --strict "$APP_PATH"
          echo "Checking signature details..."
          codesign -dvv "$APP_PATH"
          echo "Checking entitlements..."
          codesign -d --entitlements - "$APP_PATH"

      - name: Create ZIP
        run: |
          cd build/Build/Products/Release
          xattr -cr AgentMeter.app
          find AgentMeter.app -name '._*' -delete
          zip -r ../../../../AgentMeter-${{ steps.version.outputs.version }}.zip AgentMeter.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AgentMeter v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          files: AgentMeter-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keychain
        if: always()
        run: |
          if [[ -f "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain $KEYCHAIN_PATH || true
          fi
